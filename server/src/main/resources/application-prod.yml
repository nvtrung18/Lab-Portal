spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}

app:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  mail:
    from: ${MAIL_FROM:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  storage:
    cv-path: ${CV_STORAGE_PATH}
  research:
    report-storage-path: ${REPORT_STORAGE_PATH}
    product-storage-path: ${PRODUCT_STORAGE_PATH}
  dev-seed:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

ai:
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL}
    internal-service-token: ${AI_INTERNAL_SERVICE_TOKEN}
    attempt-timeout: ${AI_GATEWAY_ATTEMPT_TIMEOUT:5s}

face:
  service:
    base-url: ${FACE_SERVICE_BASE_URL}
    internal-service-token: ${FACE_INTERNAL_SERVICE_TOKEN}
  embedding-encryption-key: ${FACE_EMBEDDING_ENCRYPTION_KEY}

logging:
  level:
    root: INFO
    com.web.labportalbackend: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
