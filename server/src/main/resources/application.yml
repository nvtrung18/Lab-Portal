# ========================================================
#  Lab Portal Backend - Application Configuration
#  Profile: default (development)
# ========================================================

spring:
  config:
    import: optional:file:.env.properties

  application:
    name: lab-portal-backend

  # -------------------- DataSource --------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lab_portal}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: LabPortalHikariPool

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # -------------------- JPA / Hibernate --------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # -------------------- Flyway --------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8

  # -------------------- Jackson --------------------
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  mail:
    from: ${MAIL_FROM:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  research:
    report-storage-path: ${REPORT_STORAGE_PATH:storage/reports}
    product-storage-path: ${PRODUCT_STORAGE_PATH:storage/products}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}

# -------------------- Server --------------------
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

# -------------------- Logging --------------------
logging:
  level:
    root: INFO
    com.web.labportalbackend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# -------------------- SpringDoc / Swagger --------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# -------------------- JWT --------------------
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_EXPIRATION:86400000}    # 24 hours in ms
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in ms

# -------------------- Booking automation --------------------
# Local testing: keep "0 * * * * *" to scan once per minute.
# Production can increase the interval, for example "0 */15 * * * *".
booking:
  task:
    cron: "0 * * * * *"
    auto-no-show-enabled: false
    no-show-grace-minutes: 15
  penalty:
    default-amount: 0
