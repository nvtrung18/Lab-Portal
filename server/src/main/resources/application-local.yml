spring:
  config:
    import: optional:file:.env.properties
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lab_portal}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

app:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  storage:
    cv-path: ${CV_STORAGE_PATH:uploads/cv}
  research:
    report-storage-path: ${REPORT_STORAGE_PATH:storage/reports}
    product-storage-path: ${PRODUCT_STORAGE_PATH:storage/products}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}

ai:
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
    internal-service-token: ${AI_INTERNAL_SERVICE_TOKEN:replace_with_local_ai_internal_token}

face:
  service:
    base-url: ${FACE_SERVICE_BASE_URL:http://localhost:8091}
    internal-service-token: ${FACE_INTERNAL_SERVICE_TOKEN}
  embedding-encryption-key: ${FACE_EMBEDDING_ENCRYPTION_KEY}

logging:
  level:
    root: INFO
    com.web.labportalbackend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
