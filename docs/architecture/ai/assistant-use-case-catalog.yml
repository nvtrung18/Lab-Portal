prohibited_boundaries:
  policy: "PROHIBITED is a denial boundary only and is never downgraded. No entry below is a current use case or tool definition."
  entries:
    - { assistantKey: "RESEARCH_ASSISTANT", action: "Report approval or rejection", reason: "Official autonomous approval/write is forbidden; current report output is draft-only." }
    - { assistantKey: "RESEARCH_ASSISTANT", action: "Permission grant or membership change", reason: "Authorization and grants remain Spring and business-policy owned." }
    - { assistantKey: "RESEARCH_ASSISTANT", action: "Cross-group private read", reason: "Resolved group/project scope forbids default student whole-project access." }
    - { assistantKey: "LAB_ASSISTANT", action: "Manual check-in", reason: "Current metadata permits guidance only; attendance change is operational." }
    - { assistantKey: "LAB_ASSISTANT", action: "Penalty application or change", reason: "Operational business mutation is prohibited." }
    - { assistantKey: "LAB_ASSISTANT", action: "Permission change", reason: "The assistant cannot modify roles, ownership, or scope." }
    - { assistantKey: "LAB_ASSISTANT", action: "Other-user private booking or complaint data", reason: "Own-booking and managed-lab boundaries do not authorize cross-user private reads." }
    - { assistantKey: "ADMIN_ASSISTANT", action: "Grant Admin or alter roles", reason: "Architecture eligibility is not universal administrative authority." }
    - { assistantKey: "ADMIN_ASSISTANT", action: "Delete audit data", reason: "Audit deletion is prohibited." }
    - { assistantKey: "ADMIN_ASSISTANT", action: "Modify or disclose secrets", reason: "Secrets never enter authorized context or output." }
    - { assistantKey: "ADMIN_ASSISTANT", action: "Run a migration", reason: "Deployment and schema work are outside assistant and P6-T1 scope." }
    - { assistantKey: "ADMIN_ASSISTANT", action: "Delete arbitrary business data", reason: "Destructive official writes are prohibited." }

