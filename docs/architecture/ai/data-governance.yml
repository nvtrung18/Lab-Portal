contract:
  contract_version: "1.0.0"
  schema_version: "1.0.0"
  title: "AI Dataset Data Governance Contract"
  description: "Declarative, fail-closed governance authority for future controlled dataset artifacts; not a runtime permission, export tool, parser input, or authorization replacement."
  source_authorities:
    - document: docs/architecture/ai/assistant-use-case-catalog.yml
      version: "1.0.0"
      reference: P6-T1
    - document: docs/architecture/ai/three-assistant-contract.yml
      reference: P5A
  compatibility:
    additive_documentation_only: true
    runtime_permission_authority: false
    export_or_parser_authority: false
    spring_authorization_replacement: false
    released_evidence_requires: [contract_version, schema_version, dataset_id, dataset_version]
    amendment_rule: "A governance amendment creates a new governance version and never edits prior recorded evidence."
    fail_closed_rule: "Absent, unknown, expired, revoked, rejected, denied, withdrawn, invalidated, quarantined, or incompatible evidence denies use and quarantines the candidate pending controlled disposition."
  controlled_vocabulary:
    assistant_keys: [ADMIN_ASSISTANT, LAB_ASSISTANT, RESEARCH_ASSISTANT]
    partitions: [ADMIN_ASSISTANT, LAB_ASSISTANT, RESEARCH_ASSISTANT, SHARED]
    visibility: [ADMIN_ASSISTANT_ONLY, LAB_ASSISTANT_ONLY, RESEARCH_ASSISTANT_ONLY, SHARED]
    classifications: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
    use_decisions: [NO_DATASET_NEEDED, SYNTHETIC_ONLY, ELIGIBLE_AFTER_APPROVAL, PROHIBITED, DEFERRED]
    purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST]
    model_development_purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST]
    model_development_operations: [TRAINING, ADAPTER_FINE_TUNING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST]
    approval_statuses: [PENDING, APPROVED, REJECTED, EXPIRED, REVOKED]
    source_permission_statuses: [NOT_ASSESSED, VERIFIED, DENIED, EXPIRED, WITHDRAWN]
    lifecycle_statuses: [DRAFT, PENDING_APPROVAL, APPROVED, FROZEN, SUPERSEDED, EXPIRED, REVOKED, QUARANTINED, REJECTED]
    freeze_statuses: [NOT_REQUIRED, PENDING_FREEZE, FROZEN, INVALIDATED]
    retention_classes: [SOURCE_GOVERNED, APPROVAL_BOUND, FROZEN_EVALUATION, EPHEMERAL_DEVELOPMENT, QUARANTINE_UNTIL_DISPOSITION]
    disposition_actions: [RETAIN, DELETE, QUARANTINE, SUPERSEDE]
    provenance_types: [INTERNAL_SANITIZED, SYNTHETIC, EXTERNAL_PUBLIC, HUMAN_AUTHORED]
    split_labels: [UNSPLIT, TRAIN, VALIDATION, EVALUATION, BENCHMARK, HUMAN_EVALUATION]
    deduplication_dispositions: [NO_CANDIDATE_OVERLAP, DUPLICATES_REMOVED, OVERLAP_APPROVED_NOT_FOR_TRAIN_EVAL, REJECTED]
    sanitization_dispositions: [SANITIZED_DERIVATIVE_REQUIRED, SYNTHETIC_GENERATION_ONLY, DEFERRED_NO_EXPORT]
    field_decisions: [REMOVE, MASK, GENERALIZE, PSEUDONYMIZE, AGGREGATE, DERIVE, SYNTHETIC_REPLACE, QUARANTINE]
    source_data_owners: [ADMINISTRATION_DOMAIN_DATA_OWNER, LABORATORY_OPERATIONS_DOMAIN_DATA_OWNER, RESEARCH_GOVERNANCE_DOMAIN_DATA_OWNER, CROSS_DOMAIN_SANITIZED_DATA_OWNER]
    dataset_stewards: [ADMINISTRATION_DATASET_STEWARD, LABORATORY_OPERATIONS_DATASET_STEWARD, RESEARCH_GOVERNANCE_DATASET_STEWARD, CROSS_DOMAIN_SANITIZED_DATASET_STEWARD]
    approval_authorities: [ADMINISTRATION_DATA_GOVERNANCE_APPROVAL_AUTHORITY, LABORATORY_OPERATIONS_DATA_GOVERNANCE_APPROVAL_AUTHORITY, RESEARCH_GOVERNANCE_DATA_GOVERNANCE_APPROVAL_AUTHORITY, CROSS_DOMAIN_DATA_GOVERNANCE_APPROVAL_AUTHORITY]
  governance_rules:
    policy_field_rule: "Policy-bearing values are controlled-vocabulary scalars; free text is limited to named reason, reference, description, uri, or notes fields."
    shared_rule: "SHARED is only a partition or visibility value for a separately approved sanitized derived subset; it is never an assistant key or P6-T1 row."
    release_rule: "Use requires VERIFIED source permission, APPROVED approval, APPROVED or FROZEN lifecycle, compatible decision/purpose/state, and complete integrity and lineage evidence."
    frozen_rule: "A FROZEN evaluation, benchmark, or human-evaluation artifact is not eligible for TRAINING."
    evaluation_freeze_before_training_rule: "TRAINING requires a machine-readable prerequisite that resolves to a separate approved EVALUATION artifact with FROZEN lifecycle and freeze status and the FROZEN_EVALUATION lifecycle/purpose retention override, plus matching dataset ID/version/checksum and approval reference; otherwise retention is category-derived and APPROVED or NOT_REQUIRED evaluation evidence is insufficient."
    operation_rule: "Each model-development export declares exactly one approved controlled purpose and operation in both card and manifest; ADAPTER_FINE_TUNING maps only to TRAINING."
    sanitization_rule: "SANITIZED_DERIVATIVE_REQUIRED requires ELIGIBLE_AFTER_APPROVAL and INTERNAL_SANITIZED; SYNTHETIC_GENERATION_ONLY requires SYNTHETIC_ONLY and SYNTHETIC; DEFERRED_NO_EXPORT requires DEFERRED and no permitted purpose."
    offline_boundary: "Offline model-development work has no direct production database query, traffic capture, raw business-data transfer, or external AI-provider upload absent a future approved controlled contract."
  data_handling:
    minimization: "PUBLIC still requires provenance/license and purpose approval. INTERNAL remains in its assistant domain unless an approved sanitized shared subset exists. SENSITIVE is never raw-export eligible."
    prohibited_data: [PASSWORDS, PASSWORD_HASHES, REFRESH_TOKENS, API_KEYS, DATABASE_CREDENTIALS, SMTP_CREDENTIALS, CLOUD_CREDENTIALS, SESSION_TOKENS, OTP_SECRETS, ENCRYPTION_KEYS, AUTHENTICATION_AUTHORIZATION_ARTIFACTS, RAW_CONFIGURATION_VALUES, RAW_AUDIT_RECORDS, RAW_CONVERSATION_REPORT_LOG_BODIES, RAW_FACE_DATA_OR_EMBEDDINGS, FULL_USER_INVENTORIES, UNAPPROVED_RAW_BUSINESS_EXPORTS]
    sanitization_record:
      required_fields: [category_id, field_decision, transform_reference, reviewer_reference, result_reference, residual_risk_reference]
      decision_compatibility:
        SANITIZED_DERIVATIVE_REQUIRED: [REMOVE, MASK, GENERALIZE, PSEUDONYMIZE, AGGREGATE, DERIVE]
        SYNTHETIC_GENERATION_ONLY: [SYNTHETIC_REPLACE]
        DEFERRED_NO_EXPORT: [QUARANTINE]
    pseudonymization_rule: "Pseudonymization never permits consumer reidentification."
  data_governance_matrix:
    - {category_id: CAT_ADMIN_SYSTEM_STATUS, display_label: Admin system status, source_partition: ADMIN_ASSISTANT, source_data_owner: ADMINISTRATION_DOMAIN_DATA_OWNER, dataset_steward: ADMINISTRATION_DATASET_STEWARD, approval_authority: ADMINISTRATION_DATA_GOVERNANCE_APPROVAL_AUTHORITY, classification: INTERNAL, use_decision: ELIGIBLE_AFTER_APPROVAL, permitted_purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST], prohibited_purposes: [], retention_class: APPROVAL_BOUND, visibility: ADMIN_ASSISTANT_ONLY, sanitization_disposition: SANITIZED_DERIVATIVE_REQUIRED, use_case_ids: [ADMIN_UC_001]}
    - {category_id: CAT_ADMIN_AUDIT_SUMMARY, display_label: Admin audit summary, source_partition: ADMIN_ASSISTANT, source_data_owner: ADMINISTRATION_DOMAIN_DATA_OWNER, dataset_steward: ADMINISTRATION_DATASET_STEWARD, approval_authority: ADMINISTRATION_DATA_GOVERNANCE_APPROVAL_AUTHORITY, classification: SENSITIVE, use_decision: ELIGIBLE_AFTER_APPROVAL, permitted_purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST], prohibited_purposes: [], retention_class: APPROVAL_BOUND, visibility: ADMIN_ASSISTANT_ONLY, sanitization_disposition: SANITIZED_DERIVATIVE_REQUIRED, use_case_ids: [ADMIN_UC_002]}
    - {category_id: CAT_IDENTITY_USER_STATUS, display_label: Identity user status, source_partition: ADMIN_ASSISTANT, source_data_owner: ADMINISTRATION_DOMAIN_DATA_OWNER, dataset_steward: ADMINISTRATION_DATASET_STEWARD, approval_authority: ADMINISTRATION_DATA_GOVERNANCE_APPROVAL_AUTHORITY, classification: SENSITIVE, use_decision: ELIGIBLE_AFTER_APPROVAL, permitted_purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST], prohibited_purposes: [], retention_class: APPROVAL_BOUND, visibility: ADMIN_ASSISTANT_ONLY, sanitization_disposition: SANITIZED_DERIVATIVE_REQUIRED, use_case_ids: [ADMIN_UC_003, ADMIN_UC_005]}
    - {category_id: CAT_ADMIN_DRAFT_TEMPLATE, display_label: Admin draft template, source_partition: ADMIN_ASSISTANT, source_data_owner: ADMINISTRATION_DOMAIN_DATA_OWNER, dataset_steward: ADMINISTRATION_DATASET_STEWARD, approval_authority: ADMINISTRATION_DATA_GOVERNANCE_APPROVAL_AUTHORITY, classification: INTERNAL, use_decision: SYNTHETIC_ONLY, permitted_purposes: [TRAINING, EVALUATION, BENCHMARK, HUMAN_EVALUATION, DEVELOPMENT_TEST], prohibited_purposes: [], retention_class: EPHEMERAL_DEVELOPMENT, visibility: ADMIN_ASSISTANT_ONLY, sanitization_disposition: SYNTHETIC_GENERATION_ONLY, use_case_ids: [ADMIN_UC_004]}
