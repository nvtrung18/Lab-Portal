services:
  redis:
    image: redis:7-alpine
    container_name: lab-portal-redis
    ports:
      - "${REDIS_PORT_HOST}:6379"
    command: ["redis-server", "--appendonly", "no"]

  mysql:
    image: mysql:8.0
    container_name: lab_portal_mysql
    restart: unless-stopped
    environment:
        MYSQL_ROOT_PASSWORD: 190305
        MYSQL_DATABASE: lab_portal
    ports:
      - "3306:3306"
    volumes:
      - lab_portal_mysql_data:/var/lib/mysql
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-admin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: lab_portal_frontend_admin
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - lab_portal_frontend_admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev:admin"

  frontend-manager:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: lab_portal_frontend_manager
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5174:5174"
    volumes:
      - ./client:/app
      - lab_portal_frontend_manager_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev:manager"

  frontend-user:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: lab_portal_frontend_user
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5175:5175"
    volumes:
      - ./client:/app
      - lab_portal_frontend_user_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev:user"

volumes:
  lab_portal_mysql_data:
  lab_portal_frontend_admin_node_modules:
  lab_portal_frontend_manager_node_modules:
  lab_portal_frontend_user_node_modules:
